name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (locked)
        run: uv sync --extra dev

      # Uses the versions pinned in uv.lock, same as `just check` locally —
      # a bare `pip install ruff mypy` here would grab whatever's newest on
      # PyPI at CI run time, which can flag files the locked version doesn't
      # (e.g. ruff changing markdown-formatting behaviour between releases).
      - name: Ruff — check lint rules
        run: uv run ruff check .

      - name: Ruff — check formatting
        run: uv run ruff format --check .

      - name: Mypy — type check
        run: uv run mypy . --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio numpy pandas scipy scikit-learn
          pip install -e .

      - name: Run tests
        run: pytest tests/ --verbose
